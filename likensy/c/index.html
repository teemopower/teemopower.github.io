<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>likensy · can you draw this?</title>
<meta name="description" content="A friend drew something. Copy it with your finger and see how close you get.">
<meta property="og:title" content="Can you draw this?">
<meta property="og:description" content="A friend drew something. Copy it with your finger right here, no install needed.">
<meta name="theme-color" content="#C9B8FF">
<link rel="stylesheet" href="play.css">
</head>
<body>
<header>
  <div class="brand">likensy</div>
  <div id="from" class="from"></div>
</header>
<main id="app">
  <section class="top">
    <svg id="target" viewBox="0 0 1000 1000" aria-label="The picture to copy"></svg>
    <div class="coach">
      <p id="tip">copy it with your finger, then hit check it.</p>
      <button id="ghostBtn" class="small">show guide</button>
    </div>
  </section>
  <div class="boardwrap"><svg id="board" viewBox="0 0 1000 1000" aria-label="Drawing board"></svg></div>
  <div id="selbar" class="row hidden">
    <button data-act="turnL" aria-label="Turn left">⟲</button>
    <button data-act="turnR" aria-label="Turn right">⟳</button>
    <button data-act="copy" aria-label="Copy">⧉</button>
    <button data-act="del" aria-label="Delete">✕</button>
  </div>
  <div id="colors" class="row"></div>
  <div id="tools" class="row"></div>
  <div class="row actions">
    <button id="undo" aria-label="Undo">↶</button>
    <span class="grow"></span>
    <button id="closePoly" class="pill ghost hidden">close shape</button>
    <button id="done" class="pill">check it</button>
  </div>
  <a id="get" class="get" href="#">get likensy to keep your stars and start a streak</a>
</main>
<div id="result" class="sheet hidden"></div>
<div id="error" class="error hidden">
  <h1>hmm.</h1>
  <p id="errmsg">this link can't be read.</p>
  <a class="pill" href="https://play.google.com/store/apps/details?id=com.adaptationapps.likensy">get likensy</a>
</div>
<script src="core.js"></script>
<script src="play.js"></script>
</body>
</html>
